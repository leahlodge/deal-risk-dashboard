<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Deal Data | Dashboard</title>
    <link rel="icon" type="image/png" href="image.png">
    <link rel="stylesheet" href="upload.css">
</head>
<body>

    <!-- TOP NAV -->
    <div class="top-nav">

        <!-- LEFT SIDE -->
        <div class="nav-links">

            <span
                onclick="window.location.href='index.html'"
                style="cursor: pointer;"
            >
                Overview
            </span>

            <span
                onclick="window.location.href='screener.html'"
                style="cursor: pointer;"
            >
                Deal Analysis
            </span>

            <span class="active">
                Upload
            </span>

        </div>

        <!-- RIGHT SIDE -->
        <div class="top-right">

            <div class="logged-user">
                Logged in as:
                <span id="userRole">Loading...</span>
            </div>

            <button onclick="logout()" class="logout-btn">
                Logout
            </button>

        </div>

    </div>

    <!-- PAGE WRAPPER -->
    <div class="page">

        <!-- BACK LINK -->
        <a href="index.html" class="back-link">
            ‹ Back to Dashboard
        </a>

        <!-- MAIN CARD -->
        <div class="card">

            <!-- HEADER -->
            <div class="card-header">
                <h1>Upload Deal Data</h1>
                <p class="subtext">
                    Upload financial statements or manually enter deal details.
                    Supported formats: Excel, CSV.
                </p>
            </div>

            <!-- FILE UPLOAD -->
            <div class="section">
                <h2>Upload Financial Statements</h2>

                <div class="upload-box" id="uploadBox">
                    <p class="upload-text">
                        Drag and drop file here, or
                    </p>

                    <label class="choose-btn">
                        Choose File
                        <input
                            type="file"
                            id="fileInput"
                            accept=".csv,.xlsx,.xls"
                            hidden
                        >
                    </label>

                    <p class="file-name" id="fileName">
                        No file chosen
                    </p>
                </div>
            </div>

            <!-- DEAL DETAILS -->
            <div class="section">
                <h2>Deal Details</h2>

                <div class="form-grid">

                    <!-- ROW 1 -->
                    <div class="form-row">
                        <div class="form-field">
                            <label>Company Name</label>
                            <input
                                type="text"
                                id="company"
                                placeholder="Enter company name"
                            >
                        </div>

                        <div class="form-field">
                            <label>Sector</label>
                            <select id="sector">
                                <option value="">Select sector</option>
                                <option>Technology</option>
                                <option>Healthcare</option>
                                <option>Energy</option>
                                <option>Finance</option>
                                <option>Real Estate</option>
                                <option>Manufacturing</option>
                            </select>
                        </div>
                    </div>

                    <!-- ROW 2 -->
                    <div class="form-row">
                        <div class="form-field">
                            <label>Deal Size (£M)</label>
                            <input
                                type="number"
                                id="deal_size"
                                placeholder="Enter deal size"
                            >
                        </div>

                        <div class="form-field">
                            <label>Instrument</label>
                            <select id="instrument">
                                <option value="">Select instrument</option>
                                <option>Senior Secured Loan</option>
                                <option>Unitranche</option>
                                <option>Mezzanine</option>
                                <option>Revolver</option>
                                <option>Term Loan B</option>
                                <option>Bridge Facility</option>
                            </select>
                        </div>
                    </div>

                    <!-- ROW 3 -->
                    <div class="form-row">
                        <div class="form-field">
                            <label>Revenue (£M)</label>
                            <input
                                type="number"
                                id="revenue"
                                placeholder="Enter revenue"
                            >
                        </div>

                        <div class="form-field">
                            <label>EBITDA (£M)</label>
                            <input
                                type="number"
                                id="ebitda"
                                placeholder="Enter EBITDA"
                            >
                        </div>
                    </div>

                    <!-- ROW 4 -->
                    <div class="form-row">
                        <div class="form-field">
                            <label>Debt (£M)</label>
                            <input
                                type="number"
                                id="debt"
                                placeholder="Enter debt"
                            >
                        </div>

                        <div class="form-field">
                            <label>Interest Rate (%)</label>
                            <input
                                type="number"
                                id="interest"
                                placeholder="Enter interest rate"
                            >
                        </div>
                    </div>

                    <!-- ROW 5 -->
                    <div class="form-row">
                        <div class="form-field">
                            <label>Maturity</label>
                            <input
                                type="text"
                                id="maturity"
                                placeholder="e.g. 5 years"
                            >
                        </div>

                        <div class="form-field">
                            <label>Purpose</label>
                            <select id="purpose">
                                <option value="">Select purpose</option>
                                <option>Acquisition</option>
                                <option>Refinancing</option>
                                <option>Growth Capital</option>
                                <option>Working Capital</option>
                                <option>Expansion</option>
                                <option>Recapitalisation</option>
                            </select>
                        </div>
                    </div>

                    <!-- ROW 6 -->
                    <div class="form-row">
                        <div class="form-field">
                            <label>Current Assets (£M)</label>
                            <input
                                type="number"
                                id="current_assets"
                                placeholder="Enter current assets"
                            >
                        </div>

                        <div class="form-field">
                            <label>Current Liabilities (£M)</label>
                            <input
                                type="number"
                                id="current_liabilities"
                                placeholder="Enter current liabilities"
                            >
                        </div>
                    </div>

                </div>
            </div>

            <!-- SUBMIT -->
            <div class="submit-row">
                <button
                    class="submit-btn"
                    onclick="submitDeal()"
                >
                    Upload Deal Data
                </button>
            </div>

            <!-- STATUS -->
            <p id="status-message"></p>

        </div>
    </div>

    <script src="upload.js"></script>

    <script>
        const savedRole = localStorage.getItem("role");
        const savedUser = localStorage.getItem("username");

        document.getElementById("userRole").textContent =
            savedUser
                ? `${savedUser} (${savedRole})`
                : savedRole || "Unknown";

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("role");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
